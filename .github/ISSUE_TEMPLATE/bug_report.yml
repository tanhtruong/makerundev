name: Bug report
description: Something is wrong - a file fails to import, a metric looks off, the app breaks.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Activity files contain GPS tracks**, often starting at your home. Do not attach one unless you have removed or shifted the positions. The device, firmware and export path usually let us reproduce the problem with a generated file.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead. Paste any error output.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - File import (FIT, GPX, TCX)
        - Metrics
        - Command line
        - Web app
        - Docker
        - Other
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Watch or app the file came from
      placeholder: "Garmin Forerunner 965, firmware 21.19, Export Original from Garmin Connect"
  - type: input
    id: version
    attributes:
      label: pacelab version or commit
      placeholder: "0.1.0, or the output of git rev-parse --short HEAD"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and OS
      placeholder: "Python 3.13, macOS 26"
