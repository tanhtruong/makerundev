name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: make check

  check-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
      - run: corepack enable
      - run: uv sync --locked
      - run: make sync-web
      - run: cd apps/web && pnpm exec playwright install --with-deps chromium
      - run: make check-web

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t makerundev-server:ci .
      - run: docker run -d --name makerundev -p 8000:8000 makerundev-server:ci
      - run: |
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/activities && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/ | grep -q '<div id="root">' && exit 0
          docker logs makerundev
          exit 1
