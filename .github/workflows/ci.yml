name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: make check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t makerundev-server:ci .
      - run: docker run -d --name makerundev -p 8000:8000 makerundev-server:ci
      - run: |
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/activities && exit 0
            sleep 1
          done
          docker logs makerundev
          exit 1
