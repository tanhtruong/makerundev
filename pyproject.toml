[project]
name = "makerundev-workspace"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/makerundev", "apps/server"]

[tool.uv.sources]
makerundev = { workspace = true }
makerundev-server = { workspace = true }

[dependency-groups]
dev = [
    "makerundev",
    "makerundev-server",
    "fit-tool>=0.10.0",
    "httpx2>=2.16",
    "mypy>=2.4",
    "pytest>=9.2",
    "ruff>=0.17.6",
    "pmtiles>=3.8.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["packages/makerundev/src", "apps/server/src", "scripts"]

[[tool.mypy.overrides]]
module = ["fitdecode", "fitdecode.*", "defusedxml", "defusedxml.*", "fit_tool", "fit_tool.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages/makerundev/tests", "apps/server/tests", "scripts/tests"]
pythonpath = ["scripts", "apps/server/tests"]
addopts = "--import-mode=importlib"
