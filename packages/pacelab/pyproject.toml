[project]
name = "pacelab"
version = "0.1.0"
description = "Parse sports-watch activity files and compute running metrics."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["running", "fit", "gpx", "tcx", "garmin", "training-load", "telemetry"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "defusedxml>=0.7.1",
    "numpy>=2.0",
    "fitdecode>=0.11.0",
    "polars>=2.1",
    "typer>=0.29",
]

[project.urls]
Homepage = "https://github.com/tanhtruong/pacelab"
Documentation = "https://github.com/tanhtruong/pacelab#readme"
Issues = "https://github.com/tanhtruong/pacelab/issues"
Source = "https://github.com/tanhtruong/pacelab"

[project.scripts]
pacelab = "pacelab.cli:app"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"
