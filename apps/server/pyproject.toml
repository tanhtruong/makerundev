[project]
name = "makerundev-server"
version = "0.2.0"
description = "Self-hosted web app for your running data, built on makerundev."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "makerundev",
    "alembic>=1.20.1",
    "fastapi>=0.165",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.1",
    "tzdata>=2025.2",
    "uvicorn>=0.54",
    "httpx2>=2.16",
]

[project.scripts]
makerundev-server = "makerundev_server.main:run"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"
