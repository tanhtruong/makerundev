<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}makerundev{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', path='favicon-light.png') }}" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" href="{{ url_for('static', path='favicon-dark.png') }}" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="{{ url_for('static', path='apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="bar">
    <a class="brand" href="/">makerundev</a>
    <nav><a href="/load">Training load</a><a href="/strava">Strava</a><a href="/settings">Settings</a></nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
